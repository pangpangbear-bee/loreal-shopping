const KEY='loreal_only_picks_v1';let data=backup.picks;try{data=JSON.parse(localStorage.getItem(KEY)||'null')??data}catch(e){};
const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saleKey='loreal_only_picks_sale_v1';
let original=backup.original;
try{original=JSON.parse(localStorage.getItem(saleKey)||'null')??original}catch(e){}
function saleProducts(){return original}
function saveOriginal(){localStorage.setItem(saleKey,JSON.stringify(original))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('浏览器空间不足，请导出备份或减少图片数量。');return false}}
function pickedSale(){return original.filter(x=>x.selected)}
function ensure(id){if(!data[id])data[id]={selected:false,note:'',images:[]};return data[id]}
const brands=['Kérastase','Redken','YSL','Lancôme','Kiehl’s','Armani','L’Oréal Professionnel','L’Oréal Paris','Maybelline','Ralph Lauren','CeraVe','Matrix','Biolage','Diesel'];
function brand(name){let t=String(name||'').toLowerCase();if(/卡诗|kérastase|kerastase/.test(t))return 'Kérastase';if(/兰蔻|lanc[oô]me/.test(t))return 'Lancôme';if(/科颜氏|kiehl/.test(t))return 'Kiehl’s';if(/阿玛尼|armani/.test(t))return 'Armani';if(/圣罗兰|ysl|yves saint/.test(t))return 'YSL';if(/欧莱雅专业|professionnel/.test(t))return 'L’Oréal Professionnel';if(/欧莱雅|elvive/.test(t))return 'L’Oréal Paris';return brands.find(b=>t.includes(b.toLowerCase()))||'其他品牌'}
function fillFilter(id, values, label){
    const select=$(id);
    const previous=select.value;
    const choices=[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));
    select.replaceChildren(new Option(label,''),...choices.map(value=>new Option(value,value)));
    select.value=choices.includes(previous)?previous:'';
}
function renderPicks(){const sale=pickedSale().map(p=>({id:'sale-'+p.id,name:p.name,cat:p.category,price:p.target,source:'原购物清单',img:(typeof photos!=='undefined'?photos[p.id]:'')||''}));const guide=(typeof guideAll!=='undefined'?guideAll:[]).filter(x=>data['photo-'+x.num]?.selected).map(x=>({id:'photo-'+x.num,name:x.name,cat:x.cat,price:x.price,source:'现场实拍 #'+x.num,img:x.img}));const all=[...sale,...guide];
fillFilter('pick-brand',all.map(x=>brand(x.name)),'全部品牌');
fillFilter('pick-category',all.map(x=>x.cat),'全部品类');
const selectedBrand=$('pick-brand').value;
const selectedCategory=$('pick-category').value;
const items=all.filter(x=>(!selectedBrand||brand(x.name)===selectedBrand)&&(!selectedCategory||x.cat===selectedCategory));
$('pick-count').textContent='显示 '+items.length+' / '+all.length+' 项';$('pick-grid').innerHTML=items.length?items.map(x=>{let d=ensure(x.id);return `<article class="pick-card" data-pick="${safe(x.id)}"><div class="pick-chip">${safe(x.source)} · ${safe(x.cat)}</div>${x.img?`<img src="${x.img}" loading="lazy" alt="${safe(x.name)}">`:''}<h3>${safe(x.name)}</h3><div class="pick-chip">参考价格：${safe(x.price==null?'待核实':x.price)}</div><label>📝 我的备注 / 价格 / 色号 / 购买心得<textarea data-note="${safe(x.id)}" placeholder="例如：试色 LN3；现场 NZ$55；先看有效期">${safe(d.note)}</textarea></label><label class="pick-upload">📷 添加图片（可多选）<input type="file" accept="image/*" multiple data-upload="${safe(x.id)}"></label><div class="pick-images">${(d.images||[]).map((im,i)=>`<div><img class="pick-extra" src="${safe(im)}" alt="附加照片 ${i+1}"><button type="button" data-delimg="${safe(x.id)}" data-index="${i}">删除这张图片</button></div>`).join('')}</div><button type="button" class="remove-pick" data-remove="${safe(x.id)}">从精选移除</button></article>`}).join(''):all.length?'<div class="pick-empty">没有符合筛选条件的商品。</div>':'<div class="pick-empty">还没有选中的产品。可以导入精选清单备份。</div>'}
document.addEventListener('change',e=>{if(e.target.matches('[data-upload]')){const id=e.target.dataset.upload;const files=[...e.target.files];(async()=>{for(const f of files){if(!f.type.startsWith('image/'))continue;try{const url=await new Promise((resolve,reject)=>{const img=new Image();const obj=URL.createObjectURL(f);img.onload=()=>{let scale=Math.min(1,850/Math.max(img.width,img.height));let cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*scale));cv.height=Math.max(1,Math.round(img.height*scale));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(obj);resolve(cv.toDataURL('image/jpeg',.68))};img.onerror=reject;img.src=obj});ensure(id).images.push(url);if(!save())ensure(id).images.pop()}catch(err){alert('图片无法读取：'+f.name)}}renderPicks()})()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-note]')){ensure(e.target.dataset.note).note=e.target.value;save()}});
document.addEventListener('click',e=>{let del=e.target.closest('[data-delimg]');if(del){ensure(del.dataset.delimg).images.splice(Number(del.dataset.index),1);save();renderPicks()}let rm=e.target.closest('[data-remove]');if(rm){let id=rm.dataset.remove;if(id.startsWith('photo-')){ensure(id).selected=false;save()}else{const item=original.find(p=>'sale-'+p.id===id);if(item){item.selected=false;saveOriginal()}}renderPicks()}});
$('pick-export').onclick=()=>{let blob=new Blob([JSON.stringify({version:2,picks:data,original:saleProducts()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='欧莱雅精选清单_笔记与图片备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('pick-import').onclick=()=>$('pick-import-file').click();$('pick-import-file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.picks||typeof obj.picks!=='object')throw Error('格式不符');if(!confirm('导入将覆盖当前精选笔记和图片，确定继续吗？'))return;data=obj.picks;save();if(Array.isArray(obj.original)){original=obj.original.filter(p=>p.selected);saveOriginal()}renderPicks()}catch(err){alert('导入失败：'+err.message)}};
$('pick-brand').onchange=renderPicks;
$('pick-category').onchange=renderPicks;
$('pick-clear').onclick=()=>{
    $('pick-brand').value='';
    $('pick-category').value='';
    renderPicks();
};
renderPicks();
})();
</script></body></html>
